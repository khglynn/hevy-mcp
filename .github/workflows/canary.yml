name: canary

# Weekly "is it up" check against production. Unauthenticated on purpose: it
# proves discovery, the OAuth challenge and the start page, which is what a
# new person hits first. A failure emails the repo owner.
#
# Set the repository variable CANARY_BASE to your deployed origin (e.g.
# https://hevy.example.com). Note: GitHub disables scheduled workflows after
# 60 days without a commit — if this repo goes quiet, re-enable it from the
# Actions tab or run it by hand (workflow_dispatch stays available).

on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ vars.CANARY_BASE }}
    steps:
      - name: CANARY_BASE is set
        run: test -n "$BASE" || { echo "Set the repository variable CANARY_BASE to your deployed origin"; exit 1; }
      - name: Discovery advertises S256-only PKCE and CIMD
        run: |
          meta=$(curl -sf --max-time 20 "$BASE/.well-known/oauth-authorization-server")
          echo "$meta" | grep -q '"code_challenge_methods_supported":\["S256"\]'
          echo "$meta" | grep -q '"client_id_metadata_document_supported":true'
      - name: /mcp challenges with 401 + WWW-Authenticate
        run: |
          code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -D headers.txt -X POST "$BASE/mcp")
          test "$code" = "401"
          grep -qi '^www-authenticate: bearer' headers.txt
      - name: /start renders with the /mcp URL
        run: curl -sf --max-time 20 "$BASE/start" | grep -q "$BASE/mcp"
